<!doctype html>
<html lang="id">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0B827C">
<title>Uang Berdua</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Tata letak: buku kas. Angka rupiah rata kanan dengan angka tabular;
   dua warna profil (pa, pb) dipakai konsisten untuk "punya siapa". */
:root{
  --bg:#F1F3F8;--surface:#FFFFFF;--sunk:#E6EAF2;--ink:#131B33;--muted:#59637F;--line:#D5DBE8;--on:#FFFFFF;
  --c-nila:#2C48D0;--c-mawar:#C42F68;--c-toska:#0B827C;--c-jingga:#BF540C;--c-ungu:#7439BF;--c-daun:#2A7F38;
  --ok:#1C8048;--warn:#A85F00;--bad:#BA3127;
  --pa:var(--c-nila);--pb:var(--c-mawar);--acc:var(--pa);
  --f-display:"Bricolage Grotesque",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --f-body:"Instrument Sans",ui-sans-serif,system-ui,"Segoe UI",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0D1322;--surface:#171F35;--sunk:#222C47;--ink:#E9EDF7;--muted:#9BA6C1;--line:#2B3654;--on:#0D1322;
  --c-nila:#8497FF;--c-mawar:#FF7DAA;--c-toska:#3FCFC7;--c-jingga:#FF9A52;--c-ungu:#B994FF;--c-daun:#6FD17C;
  --ok:#5FD08F;--warn:#F0B04A;--bad:#FF8A7E;color-scheme:dark}}
:root[data-ca="nila"]{--pa:var(--c-nila)}:root[data-ca="mawar"]{--pa:var(--c-mawar)}:root[data-ca="toska"]{--pa:var(--c-toska)}
:root[data-ca="jingga"]{--pa:var(--c-jingga)}:root[data-ca="ungu"]{--pa:var(--c-ungu)}:root[data-ca="daun"]{--pa:var(--c-daun)}
:root[data-cb="nila"]{--pb:var(--c-nila)}:root[data-cb="mawar"]{--pb:var(--c-mawar)}:root[data-cb="toska"]{--pb:var(--c-toska)}
:root[data-cb="jingga"]{--pb:var(--c-jingga)}:root[data-cb="ungu"]{--pb:var(--c-ungu)}:root[data-cb="daun"]{--pb:var(--c-daun)}

*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 var(--f-body);-webkit-text-size-adjust:100%}
h1,h2,h3{font-family:var(--f-display);font-weight:700;line-height:1.15;margin:0;text-wrap:balance}
h1{font-size:1.15rem}h2{font-size:1.35rem}h3{font-size:1.05rem}
p{margin:0}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--acc);outline-offset:2px}
.va{--acc:var(--pa)}.vb{--acc:var(--pb)}
.muted{color:var(--muted)}
.eyebrow{font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;font-weight:600;color:var(--muted)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.up{color:var(--ok)}.down{color:var(--bad)}

#app{max-width:1080px;margin:0 auto;padding-inline:16px;padding-block:14px 9rem;display:flex;flex-direction:column;gap:14px}
.top{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px 16px}
.brand p{font-size:.82rem;color:var(--muted)}
.who{display:flex;background:var(--sunk);border-radius:99px;padding:3px;gap:2px;max-width:100%}
.who-b{border:0;background:none;border-radius:99px;padding:.45rem .85rem;display:flex;align-items:center;gap:.4rem;font-weight:500;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who-b[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}
.sw{width:.6rem;height:.6rem;border-radius:50%;flex:none;display:inline-block}
.sw.a{background:var(--pa)}.sw.b{background:var(--pb)}
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--wall,none)}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.av{border-radius:50%;object-fit:cover;flex:none;display:inline-grid;place-items:center;background:var(--c);color:var(--on);font-family:var(--f-display);font-weight:700;line-height:1}
.avs{display:flex;flex:none}.avs .av{box-shadow:0 0 0 2px var(--surface)}.avs .av+.av{margin-left:-8px}
.filebtn{display:inline-flex;align-items:center;font-size:inherit;color:var(--ink);cursor:pointer}
.vh{position:absolute;opacity:0;width:1px;height:1px}
.walls button{border-radius:10px;width:3.2rem}
.goal-h{display:flex;gap:.7rem;align-items:center}
.kv{display:flex;justify-content:space-between;gap:8px;font-size:.9rem}.kv span:first-child{color:var(--muted)}
.bar.split{display:flex}.bar.split u{border-radius:0}.bar.split u.a{background:var(--pa)}.bar.split u.b{background:var(--pb)}
details.hist summary{cursor:pointer;color:var(--muted);font-size:.88rem;padding:.2rem 0}
.mv{display:grid;grid-template-columns:minmax(0,1fr) auto 2.4rem;gap:.5rem;align-items:center;padding:.3rem 0;border-top:1px solid var(--line);font-size:.9rem}
.mv small{display:block;color:var(--muted);font-size:.8rem;overflow-wrap:anywhere}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:5;display:flex;background:var(--surface);border-top:1px solid var(--line);padding:4px 6px calc(4px + env(safe-area-inset-bottom,0px))}
.nav button{flex:1;min-width:0;border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:.4rem .1rem;border-radius:10px;color:var(--muted);font-size:.72rem;font-weight:500}
.nav button[aria-current="page"]{color:var(--acc)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#view{display:flex;flex-direction:column;gap:14px;min-width:0}
#fab{position:fixed;right:16px;bottom:calc(4.6rem + env(safe-area-inset-bottom,0px));z-index:6;border:0;border-radius:99px;background:var(--acc);color:var(--on);font-weight:600;padding:.8rem 1.2rem;box-shadow:0 6px 18px rgb(0 0 0 / .25)}

@media (min-width:900px){
  #app{display:grid;grid-template-columns:190px minmax(0,1fr);grid-template-areas:"nav top" "nav view";align-items:start;gap:18px 28px;padding-block:22px 6.5rem}
  .top{grid-area:top}#view{grid-area:view}
  .nav{grid-area:nav;position:sticky;top:22px;flex-direction:column;border:0;background:none;padding:0;gap:2px}
  .nav button{flex:none;flex-direction:row;gap:.7rem;padding:.6rem .8rem;font-size:.95rem;justify-content:flex-start}
  .nav button[aria-current="page"]{background:var(--surface);color:var(--ink)}
  .nav button[aria-current="page"] svg{color:var(--acc)}
  #fab{bottom:28px;right:28px}
}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;min-width:0}
.card>h3{margin-bottom:10px}
.hd{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.notice{border-radius:10px;padding:.6rem .8rem;background:var(--sunk);font-size:.9rem;display:flex;flex-wrap:wrap;gap:.4rem 1rem;align-items:center;justify-content:space-between}
.empty{padding:28px 4px;display:flex;flex-direction:column;gap:6px;max-width:34rem}
.stack{display:flex;flex-direction:column;gap:12px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.6rem .95rem;font-weight:500;min-height:2.6rem}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--acc);border-color:var(--acc);color:var(--on)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btns{display:flex;flex-wrap:wrap;gap:8px}
input[type=text],input[type=date],select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:.55rem .7rem;min-height:2.6rem;width:100%;min-width:0}
label{font-size:.82rem;font-weight:600;color:var(--muted)}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.send{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px}
.ib{border:0;background:none;width:2.4rem;height:2.4rem;border-radius:8px;display:grid;place-items:center;color:var(--muted);font-size:1.3rem;line-height:1}
.ib:hover{background:var(--sunk);color:var(--ink)}
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px}
.mnav strong{font-family:var(--f-display);font-size:1.1rem}
.seg{display:flex;background:var(--sunk);border-radius:10px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:none;border-radius:8px;padding:.5rem .7rem;font-weight:500;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgb(0 0 0 / .12)}

.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tile b{font:700 1.3rem var(--f-display);font-variant-numeric:tabular-nums;line-height:1.15;overflow-wrap:anywhere}
.tile span{font-size:.82rem;color:var(--muted)}
.big{font:700 2rem var(--f-display);font-variant-numeric:tabular-nums;line-height:1.1;overflow-wrap:anywhere}
.bar{height:8px;border-radius:8px;background:var(--sunk);overflow:hidden}
.bar u{display:block;height:100%;border-radius:8px;background:var(--acc)}
.bar.over u{background:var(--bad)}.bar.near u{background:var(--warn)}
.chart{width:100%;height:auto;display:block}
.chart rect{fill:var(--acc);opacity:.55}.chart rect.t{opacity:1}.chart rect.z{fill:var(--sunk);opacity:1}
.ch-g{stroke:var(--line);stroke-width:1;stroke-dasharray:3 3}.ch-t{fill:var(--muted);font:11px var(--f-body)}

.cat{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:2px .7rem;align-items:center;padding:.5rem 0;border-top:1px solid var(--line)}
.cat:first-of-type{border-top:0}
.cat .bar{grid-column:2/-1}.cat .bar u{background:var(--k)}
.cat small{grid-column:2/-1;color:var(--muted);font-size:.8rem}
.em{width:2.2rem;height:2.2rem;border-radius:50%;display:grid;place-items:center;font-size:1.05rem;background:color-mix(in srgb,var(--k) 20%,var(--surface));flex:none}
.dayh{display:flex;justify-content:space-between;gap:8px;padding:.9rem 0 .3rem;font-size:.8rem;font-weight:600;color:var(--muted);letter-spacing:.03em;text-transform:uppercase}
.dayh:first-child{padding-top:0}
.tx{display:grid;grid-template-columns:2.2rem minmax(0,1fr) auto;gap:0 .7rem;align-items:center;padding:.55rem 0;border:0;border-top:1px solid var(--line);width:100%;background:none;text-align:left;border-radius:0}
.tx:hover{background:color-mix(in srgb,var(--sunk) 50%,transparent)}
.tx .nm{font-weight:500;overflow-wrap:anywhere}
.tx .meta{display:flex;flex-wrap:wrap;gap:.15rem .45rem;font-size:.8rem;color:var(--muted);align-items:center}
.tx .amt{text-align:right;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx .amt small{display:block;font-weight:400;color:var(--muted);font-size:.76rem}
.tag{font-size:.66rem;letter-spacing:.05em;text-transform:uppercase;font-weight:600;padding:.08rem .45rem;border-radius:99px;white-space:nowrap;box-shadow:inset 0 0 0 1px var(--line);color:var(--ink)}
.duo{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,280px),1fr));gap:14px}
.sws{display:flex;flex-wrap:wrap;gap:8px}
.sws button{width:2.4rem;height:2.4rem;border-radius:50%;border:3px solid var(--surface);background:var(--c);box-shadow:0 0 0 1px var(--line)}
.sws button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--ink)}
.bud{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}

dialog{border:1px solid var(--line);border-radius:18px;background:var(--surface);color:var(--ink);padding:18px;width:min(100% - 24px,440px);max-height:calc(100% - 24px)}
dialog::backdrop{background:rgb(8 12 24 / .5)}
.form{display:flex;flex-direction:column;gap:12px}
#f-amt{font:700 1.6rem var(--f-display);font-variant-numeric:tabular-nums}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(8.4rem + env(safe-area-inset-bottom,0px));z-index:20;background:var(--ink);color:var(--bg);padding:.6rem 1rem;border-radius:10px;font-size:.9rem;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgb(0 0 0 / .25)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>

<div id="app" class="va">
  <header class="top">
    <div class="brand"><span id="duo" class="avs"></span><div><h1>Uang Berdua</h1><p id="sub"></p></div></div>
    <div id="who" class="who" role="group" aria-label="Keuangan siapa yang ditampilkan"></div>
  </header>
  <nav id="nav" class="nav" aria-label="Halaman"></nav>
  <main id="view">
    <div class="empty"><h2>Memuat catatan…</h2><p class="muted">Pengeluaran kalian berdua akan muncul di sini.</p></div>
  </main>
</div>
<button id="fab" type="button" hidden>+ Catat</button>
<dialog id="dlg" aria-label="Catat transaksi"></dialog>
<div id="toast" role="status" aria-live="polite" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="config.js"></script>
<script>
(()=>{'use strict';
const DAYS=['Senin','Selasa','Rabu','Kamis','Jumat','Sabtu','Minggu'];
const MON=['Januari','Februari','Maret','April','Mei','Juni','Juli','Agustus','September','Oktober','November','Desember'];
/* kunci: [label, emoji, warna] */
const CAT={makan:['Makan & minum','🍜','#D9762B'],transport:['Transport','🛵','#3B82C4'],belanja:['Belanja','🛍️','#B8529E'],
  tagihan:['Tagihan & pulsa','🧾','#5B6B8C'],kos:['Kos / rumah','🏠','#8A6A3B'],kencan:['Kencan','💞','#D2456F'],
  hiburan:['Hiburan','🎮','#7B55C7'],sehat:['Kesehatan','💊','#2E9B7A'],kuliah:['Pendidikan','📚','#2F7FA8'],
  hadiah:['Hadiah & donasi','🎁','#C7493A'],lain:['Lainnya','📦','#7A8194']};
const INC={saku:['Uang saku','💵','#3F8F3F'],gaji:['Gaji / honor','💼','#2F7FA8'],usaha:['Usaha','🏪','#D9762B'],
  invest:['Hasil investasi','📈','#7B55C7'],masuk:['Pemasukan lain','➕','#7A8194']};
/* kunci: [label, emoji, punya nilai pasar yang naik turun] */
const KIND={tabung:['Tabungan','🏦',false],darurat:['Dana darurat','🛟',false],reksa:['Reksa dana','📊',true],saham:['Saham','📈',true],
  emas:['Emas','🪙',true],deposito:['Deposito / SBN','🏛️',true],kripto:['Kripto','💠',true],lain:['Lainnya','🎯',false]};
const SETTLE=['Pelunasan','🤝','#7A8194'];
const SPLIT={self:'Untuk yang bayar sendiri',both:'Berdua, dibagi dua',other:'Untuk pasangannya (ditalangi)'};
const COLORS={nila:'Nila',mawar:'Mawar',toska:'Toska',jingga:'Jingga',ungu:'Ungu',daun:'Daun'};
const TABS=[['ringkas','Ringkasan','<path d="M4 19V5M4 19h16M8 16v-5M12 16V8M16 16v-3"/>'],
  ['transaksi','Transaksi','<path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/>'],
  ['tabungan','Tabungan','<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r=".8"/>'],
  ['berdua','Berdua','<circle cx="9" cy="12" r="5.5"/><circle cx="15" cy="12" r="5.5"/>'],
  ['atur','Atur','<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>']];
const DATE=/^\d{4}-\d\d-\d\d$/, MAXAMT=1e12, PHOTO=/^data:image\/jpeg;base64,[A-Za-z0-9+\/=]+$/;

/* ---------- util ---------- */
const $=id=>document.getElementById(id);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const parse=s=>{const p=s.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const today=()=>iso(new Date());
const nice=s=>{const d=parse(s);return DAYS[(d.getDay()+6)%7]+', '+d.getDate()+' '+MON[d.getMonth()].slice(0,3)};
const addM=(ym,n)=>{const d=new Date(+ym.slice(0,4),+ym.slice(5,7)-1+n,1);return d.getFullYear()+'-'+pad(d.getMonth()+1)};
const daysIn=ym=>new Date(+ym.slice(0,4),+ym.slice(5,7),0).getDate();
const mLabel=ym=>MON[+ym.slice(5,7)-1]+' '+ym.slice(0,4);
const other=sl=>sl==='a'?'b':'a';
const str=(v,max)=>typeof v==='string'?v.slice(0,max):'';
const int=v=>{v=Math.floor(+v);return v>0&&v<=MAXAMT?v:0};
const sum=a=>a.reduce((x,y)=>x+y,0);
const fmt=n=>Math.round(n).toLocaleString('id-ID');
const rp=n=>(n<0?'−':'')+'Rp'+fmt(Math.abs(n));
const short=n=>n>=1e6?(n/1e6).toFixed(n%1e6?1:0).replace('.',',')+' jt':n>=1e3?Math.round(n/1e3)+' rb':String(n);
const digits=v=>int(String(v).replace(/\D/g,''));

function h(t,a,...c){const e=document.createElement(t);
  if(a)for(const k in a){const v=a[k];if(v==null||v===false)continue;
    if(k==='class')e.className=v;else if(k==='text')e.textContent=v;
    else if(k.slice(0,2)==='on')e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v)}
  for(const x of c.flat(9)){if(x==null||x===false||x==='')continue;e.append(x.nodeType?x:document.createTextNode(String(x)))}
  return e}
function s(t,a,...c){const e=document.createElementNS('http://www.w3.org/2000/svg',t);
  if(a)for(const k in a){if(a[k]!=null)e.setAttribute(k,a[k])}
  for(const x of c.flat(9)){if(x==null||x===false)continue;e.append(x.nodeType?x:document.createTextNode(String(x)))}
  return e}
function icon(paths){const e=s('svg',{viewBox:'0 0 24 24','aria-hidden':'true'});e.innerHTML=paths;return e}
let toastT;function toast(m){const t=$('toast');t.textContent=m;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>{t.hidden=true},3200)}
/* Rupiah diketik sebagai teks supaya keyboard angka muncul di HP dan titik ribuan langsung terlihat */
function moneyIn(id,val,on){return h('input',{type:'text',id,inputmode:'numeric',autocomplete:'off',placeholder:'0',value:val?fmt(val):'',
  oninput:e=>{const n=digits(e.target.value);e.target.value=n?fmt(n):''},onchange:on&&(e=>on(digits(e.target.value))),onfocus:e=>e.target.select()})}
const field=(label,id,el)=>h('div',{class:'field'},h('label',{for:id,text:label}),el);

/* ---------- state ---------- */
const S={me:null,view:'a',tab:'ringkas',month:today().slice(0,7),fs:null,db:null,room:null,ready:false,
  tx:[],q1:{},q2:{},goals:[],meta:{names:{},colors:{},budget:{},photos:{}},jn:{},jp:{},fcat:'',open:null};

/* ---------- normalisasi data (semua isi penyimpanan dianggap tidak tepercaya) ---------- */
function normTx(x,id){if(!x||typeof x!=='object')return null;
  const type=x.type==='in'||x.type==='settle'?x.type:'out',amt=int(x.amt);
  if(!amt||!DATE.test(x.date)||(x.by!=='a'&&x.by!=='b'))return null;
  const set=type==='in'?INC:CAT;
  return{id,type,amt,date:x.date,by:x.by,ts:+x.ts||0,note:str(x.note,80).trim(),
    cat:type==='settle'?'':(set[x.cat]?x.cat:(type==='in'?'masuk':'lain')),
    split:type==='out'&&SPLIT[x.split]?x.split:'self'}}
function normMeta(d){const m={names:{},colors:{},budget:{},photos:{}};d=d&&typeof d==='object'?d:{};
  ['a','b'].forEach(sl=>{m.names[sl]=str(d.names&&d.names[sl],30).trim();
    const c=d.colors&&d.colors[sl];m.colors[sl]=COLORS[c]?c:(sl==='a'?'nila':'mawar');
    const b=d.budget&&d.budget[sl]||{},cats={};for(const k in CAT){const v=int(b.cats&&b.cats[k]);if(v)cats[k]=v}
    m.budget[sl]={total:int(b.total),cats};

    :empty('Belum ada transaksi bersama di '+mLabel(m),'Saat mencatat, pilih "Berdua, dibagi dua" atau "Untuk pasangannya" supaya masuk hitungan di sini.'));
  return out}

function goalCard(g,x){const K=KIND[g.kind],pct=g.target?Math.min(100,Math.round(x.val/g.target*100)):0,left=g.target-x.val,cur=today().slice(0,7),ref=goalRef(g.id);
  let plan='';
  if(g.target&&left<=0)plan='Target tercapai 🎉';
  else if(g.target&&g.due){const n=Math.max(1,(+g.due.slice(0,4)-+cur.slice(0,4))*12+(+g.due.slice(5,7)-+cur.slice(5,7))+1);
    plan=g.due<today()?'Tenggat '+nice(g.due)+' sudah lewat, masih kurang '+rp(left)+'.':'Kurang '+rp(left)+'. Perlu sekitar '+rp(left/n)+' per bulan sampai '+mLabel(g.due.slice(0,7))+'.'}
  else if(g.target)plan='Kurang '+rp(left)+' lagi.';
  const tot=Math.max(1,Math.max(0,x.c.a)+Math.max(0,x.c.b));
  return h('section',{class:'card stack v'+(g.owner==='both'?S.me:g.owner)},
    h('div',{class:'goal-h'},h('span',{class:'em',style:'--k:var(--acc)','aria-hidden':'true'},K[1]),
      h('div',{style:'flex:1;min-width:0'},h('h3',{text:g.name}),h('span',{class:'muted',text:K[0]+' · '+(g.owner==='both'?'Berdua':pname(g.owner))})),
      h('span',{class:'avs'},(g.owner==='both'?['a','b']:[g.owner]).map(sl=>avatar(sl,28))),
      h('button',{class:'ib',type:'button','aria-label':'Ubah tujuan '+g.name,onclick:()=>openGoal(g)},'✎')),
    h('div',null,h('div',{class:'big',style:'font-size:1.6rem',text:rp(x.val)}),g.target?h('span',{class:'muted num',text:pct+'% dari target '+rp(g.target)}):null),
    g.target?h('div',{class:'bar'},h('u',{style:'width:'+pct+'%'})):null,
    plan&&h('p',{text:plan}),
    x.inv?[h('div',{class:'kv'},h('span',{text:'Modal disetor'}),h('b',{class:'num',text:rp(x.net)})),
      h('div',{class:'kv'},h('span',{text:'Nilai per '+nice(g.valAt)}),h('b',{class:'num',text:rp(x.val)})),
      h('div',{class:'kv'},h('span',{text:'Untung / rugi'}),h('b',{class:'num '+(x.gain<0?'down':'up'),text:(x.gain>0?'+':'')+rp(x.gain)+(x.net>0?' ('+(x.gain/x.net*100).toFixed(1).replace('.',',')+'%)':'')}))]
      :KIND[g.kind][2]&&h('p',{class:'muted',text:'Tekan "Perbarui nilai" kalau harganya sudah berubah, supaya untung atau ruginya terlihat.'}),
    g.owner==='both'&&x.net>0?[h('div',{class:'bar split'},h('u',{class:'a',style:'width:'+Math.max(0,x.c.a)/tot*100+'%'}),h('u',{class:'b',style:'width:'+Math.max(0,x.c.b)/tot*100+'%'})),
      h('div',{class:'kv'},h('span',{text:pname('a')+' '+rp(x.c.a)}),h('span',{class:'muted',text:pname('b')+' '+rp(x.c.b)}))]:null,
    h('div',{class:'btns'},h('button',{class:'btn pri',type:'button',onclick:()=>openMove(g,1)},'Setor'),
      x.net>0&&h('button',{class:'btn',type:'button',onclick:()=>openMove(g,-1)},'Tarik'),
      KIND[g.kind][2]&&h('button',{class:'btn',type:'button',onclick:()=>openValue(g,x)},'Perbarui nilai')),
    g.moves.length?h('details',{class:'hist',open:S.open===g.id,ontoggle:e=>{if(e.target.open)S.open=g.id;else if(S.open===g.id)S.open=null}},h('summary',{text:'Riwayat ('+g.moves.length+')'}),
      g.moves.slice().reverse().slice(0,40).map(m=>h('div',{class:'mv'},h('span',null,nice(m.d)+' · '+pname(m.by),m.note&&h('small',{text:m.note})),
        h('b',{class:'num '+(m.amt<0?'down':'up'),text:(m.amt>0?'+':'')+rp(m.amt)}),
        h('button',{class:'ib',type:'button','aria-label':'Hapus catatan '+rp(m.amt),title:'Hapus',onclick:e=>{const b=e.currentTarget;
          if(!b.dataset.arm){b.dataset.arm=1;b.textContent='?';b.style.color='var(--bad)';return}
          const p={moves:g.moves.filter(y=>y.id!==m.id)};if(g.valAt)p.value=Math.max(0,g.value-m.amt);ref.update(p).catch(writeFail)}},'×')))):null)}
function vTabungan(){const st=S.goals.map(g=>[g,gStat(g)]),gain=sum(st.filter(x=>x[1].inv).map(x=>x[1].gain));
  const out=[h('div',{class:'tiles'},tile('Total tabungan & investasi',rp(sum(st.map(x=>x[1].val)))),tile('Disetor bulan ini',rp(savedIn(today().slice(0,7)))),
      st.some(x=>x[1].inv)&&tile('Untung / rugi investasi',(gain>0?'+':'')+rp(gain),gain<0?'down':'up')),
    h('div',{class:'btns'},h('button',{class:'btn pri',type:'button',onclick:()=>openGoal(null)},'Buat tujuan baru'))];
  if(!st.length)out.push(empty('Belum ada tujuan menabung','Buat tujuan seperti dana darurat, liburan, atau reksa dana. Setiap setoran dicatat di sini dan dikurangkan dari sisa uang bulananmu.'));
  st.forEach(x=>out.push(goalCard(x[0],x[1])));
  return out}

function vAtur(){const me=S.me,B=S.meta.budget[me];
  const setBud=(k,v)=>saveMeta({budget:{[me]:k?{cats:{[k]:v}}:{total:v}}});
  return[h('section',{class:'card stack v'+me},h('h3',{text:'Profilmu'}),
      field('Nama','at-nm',h('input',{type:'text',id:'at-nm',maxlength:30,value:S.meta.names[me]||'',placeholder:S.jn[me]||'Namamu',onchange:e=>saveMeta({names:{[me]:e.target.value.trim().slice(0,30)}})})),
      h('div',{class:'field'},h('label',{for:'pf-p',text:'Foto profil'}),h('div',{class:'btns',style:'align-items:center'},avatar(me,56),
        h('label',{class:'btn filebtn',for:'pf-p'},S.meta.photos[me]?'Ganti foto':'Pilih foto'),
        h('input',{type:'file',id:'pf-p',accept:'image/*',class:'vh',onchange:e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
          readImg(f,160,true,.82).then(d=>{saveMeta({photos:{[me]:d}});toast('Foto profil diganti.')},()=>toast('Gambar itu tidak bisa dibaca.'))}}),
        S.meta.photos[me]?h('button',{class:'btn',type:'button',onclick:()=>saveMeta({photos:{[me]:''}})},'Hapus foto'):null)),
      h('div',{class:'field'},h('label',{text:'Warna'}),h('div',{class:'sws'},Object.keys(COLORS).map(c=>h('button',{type:'button',style:'--c:var(--c-'+c+')','aria-label':COLORS[c],'aria-pressed':String(S.meta.colors[me]===c),onclick:()=>saveMeta({colors:{[me]:c}})}))))),
    h('section',{class:'card stack'},h('h3',{text:'Anggaran bulananmu'}),
      h('p',{class:'muted',style:'max-width:65ch',text:'Batas total dipakai untuk menghitung sisa uang per hari. Batas per kategori boleh dikosongkan.'}),
      field('Batas total per bulan (Rp)','bd-total',moneyIn('bd-total',B.total,v=>setBud(null,v))),
      h('div',{class:'bud'},Object.keys(CAT).map(k=>field(CAT[k][1]+' '+CAT[k][0],'bd-'+k,moneyIn('bd-'+k,B.cats[k],v=>setBud(k,v)))))),
    h('section',{class:'card stack'},h('h3',{text:'Latar halaman'}),
      h('p',{class:'muted',style:'max-width:65ch',text:'Latar berlaku untuk kalian berdua di semua perangkat. Siapa pun dari kalian bisa menggantinya.'+(wallKey()==='photo'?' Saat ini memakai foto unggahan.':'')}),
      h('div',{class:'sws walls',role:'group','aria-label':'Latar halaman'},Object.keys(WALLS).map(k=>h('button',{type:'button',style:'background:'+(WALLS[k][1]||'var(--bg)'),
        'aria-pressed':String(wallKey()===k),'aria-label':'Latar '+WALLS[k][0],title:WALLS[k][0],onclick:()=>setWall({key:k})}))),
      h('div',{class:'btns'},h('label',{class:'btn filebtn',for:'wl-f'},'Unggah foto latar'),
        h('input',{type:'file',id:'wl-f',accept:'image/*',class:'vh',onchange:e=>{const f=e.target.files&&e.target.files[0];if(!f)return;
          readImg(f,1280,false,.7).then(d=>{if(d.length>900000){toast('Foto itu terlalu besar. Pilih foto lain.');return}
            setWall({key:'photo',img:d});toast('Latar diganti untuk kalian berdua.')},()=>toast('Gambar itu tidak bisa dibaca.'))}}))),
    h('section',{class:'card stack'},h('h3',{text:'Ruang bersama'}),
      h('p',{class:'muted',style:'max-width:65ch',text:'Kirim tautan ini ke pasanganmu, dan ke perangkatmu yang lain. Siapa pun yang memegangnya bisa membaca dan mengubah catatan kalian.'}),
      h('div',{class:'send'},h('input',{type:'text',readonly:true,value:roomLink(),'aria-label':'Tautan ruang',onfocus:e=>e.target.select()}),
        h('button',{class:'btn',type:'button',onclick:()=>navigator.clipboard.writeText(roomLink()).then(()=>toast('Tautan disalin.'),()=>toast('Tidak bisa menyalin. Salin manual dari kotaknya.'))},'Salin')),
      h('div',{class:'btns'},h('button',{class:'btn',type:'button',onclick:exportCsv},'Unduh CSV'),
        h('button',{class:'btn',type:'button',onclick:()=>setMe(other(me))},'Pindah ke profil '+pname(other(me))),
        armBtn('Keluar dari ruang','Yakin keluar dari ruang ini?',()=>{['ub-room','ub-me','ub-wall','ub-wall-img'].forEach(k=>lsSet(k,null));location.reload()})))]}

function exportCsv(){const q=v=>'"'+String(v).replace(/"/g,'""')+'"',rows=[['tanggal','jenis','jumlah','kategori','catatan','dibayar_oleh','untuk']];
  S.tx.slice().reverse().forEach(t=>rows.push([t.date,t.type==='in'?'pemasukan':t.type==='settle'?'pelunasan':'pengeluaran',t.amt,catOf(t)[0],t.note,pname(t.by),
    t.type==='out'?(t.split==='both'?'berdua':t.split==='other'?pname(other(t.by)):pname(t.by)):'']));
  S.goals.forEach(g=>g.moves.forEach(m=>rows.push([m.d,m.amt<0?'tarik tabungan':'setor tabungan',Math.abs(m.amt),g.name,m.note,pname(m.by),g.owner==='both'?'berdua':pname(g.owner)])));
  const a=h('a',{href:URL.createObjectURL(new Blob(['﻿'+rows.map(r=>r.map(q).join(',')).join('\r\n')],{type:'text/csv'})),download:'uang-berdua-'+today()+'.csv'});
  a.click();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}

/* ---------- dialog ---------- */
function whoSel(id,val){return h('select',{id},['a','b'].map(sl=>h('option',{value:sl,selected:sl===val},pname(sl)+(sl===S.me?' (saya)':''))))}
function armBtn(label,sure,fn){return h('button',{class:'btn danger',type:'button',onclick:e=>{if(e.target.dataset.arm)fn();else{e.target.dataset.arm=1;e.target.textContent=sure}}},label)}
/* onSubmit mengembalikan false kalau isian belum sah, supaya dialog tetap terbuka */
function dlgForm(title,fields,onSubmit,extra){const d=$('dlg');
  d.replaceChildren(h('form',{class:'form',onsubmit:e=>{e.preventDefault();if(onSubmit()!==false)d.close()}},h('h3',{text:title}),fields,
    h('div',{class:'btns',style:'justify-content:space-between'},h('div',{class:'btns'},h('button',{class:'btn pri',type:'submit'},'Simpan'),h('button',{class:'btn',type:'button',onclick:()=>d.close()},'Batal')),extra)));
  d.showModal()}
function amtDate(){const amt=digits($('f-amt').value),date=$('f-date').value;
  if(!amt){toast('Isi jumlahnya dulu.');$('f-amt').focus();return null}
  if(!DATE.test(date)||date>today()){toast('Tanggal tidak valid atau masih di masa depan.');return null}
  return{amt,date}}
const dateIn=v=>field('Tanggal','f-date',h('input',{type:'date',id:'f-date',value:v,max:today(),required:true}));
const noteIn=(v,ph,max)=>field('Catatan (boleh kosong)','f-note',h('input',{type:'text',id:'f-note',maxlength:max,value:v,placeholder:ph,autocomplete:'off'}));
function show(title,fields,t,onSave){
  dlgForm(title,fields,()=>{const v=amtDate();if(!v)return false;
    saveTx(t&&t.id,Object.assign({amt:v.amt,date:v.date,ts:t?t.ts:Date.now(),note:$('f-note').value.trim().slice(0,80)},onSave()));toast(t?'Perubahan disimpan.':'Tercatat.')},
    t&&armBtn('Hapus','Yakin hapus?',()=>{delTx(t.id);$('dlg').close();toast('Dihapus.')}));
  if(!t)$('f-amt').focus()}
function openTx(t){const e=t||{type:'out',amt:0,cat:'',date:today(),by:S.me,split:'self',note:''};let type=e.type;
  const sel=(id,set,def)=>h('select',{id},Object.keys(set).map(k=>h('option',{value:k,selected:k===(set[e.cat]?e.cat:def)},set[k][1]+' '+set[k][0])));
  const fOut=field('Kategori','f-cat-out',sel('f-cat-out',CAT,'makan')),fIn=field('Kategori','f-cat-in',sel('f-cat-in',INC,'saku'));
  const fSplit=field('Untuk siapa','f-split',h('select',{id:'f-split'},Object.keys(SPLIT).map(k=>h('option',{value:k,selected:k===e.split},SPLIT[k]))));
  const seg=h('div',{class:'seg',role:'group','aria-label':'Jenis'},[['out','Pengeluaran'],['in','Pemasukan']].map(([k,l])=>h('button',{type:'button','data-k':k,onclick:()=>{type=k;sync()}},l)));
  const sync=()=>{seg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.k===type)));fOut.hidden=fSplit.hidden=type!=='out';fIn.hidden=type!=='in'};
  sync();
  show(t?'Ubah transaksi':'Catat transaksi',[seg,field('Jumlah (Rp)','f-amt',moneyIn('f-amt',e.amt)),fOut,fIn,
    h('div',{class:'two'},dateIn(e.date),field('Dibayar / diterima oleh','f-by',whoSel('f-by',e.by))),fSplit,noteIn(e.note,'mis. nasi padang, bensin',80)],t,
    ()=>{const split=type==='out'?$('f-split').value:'self';return{type,by:$('f-by').value,cat:$(type==='out'?'f-cat-out':'f-cat-in').value,split,sh:split!=='self'}})}
function openSettle(t){const D=debtLine(),e=t||{amt:D?D.amt:0,date:today(),by:D?D.deb:S.me,note:''};
  show(t?'Ubah pelunasan':'Catat pelunasan',[h('p',{class:'muted',text:'Dipakai saat salah satu mentransfer atau memberi uang untuk melunasi utang ke pasangannya.'}),
    field('Yang membayar','f-by',whoSel('f-by',e.by)),field('Jumlah (Rp)','f-amt',moneyIn('f-amt',e.amt)),
    dateIn(e.date),noteIn(e.note,'mis. transfer BCA',80)],t,
    ()=>({type:'settle',by:$('f-by').value,cat:'',split:'self',sh:true}))}

function openGoal(g){const e=g||{name:'',kind:'tabung',owner:S.me,target:0,due:''};
  dlgForm(g?'Ubah tujuan':'Tujuan menabung baru',[
    field('Nama tujuan','g-name',h('input',{type:'text',id:'g-name',maxlength:40,value:e.name,placeholder:'mis. Dana darurat, Liburan Bali',autocomplete:'off',required:true})),
    h('div',{class:'two'},field('Jenis','g-kind',h('select',{id:'g-kind'},Object.keys(KIND).map(k=>h('option',{value:k,selected:k===e.kind},KIND[k][1]+' '+KIND[k][0])))),
      field('Milik','g-owner',h('select',{id:'g-owner'},[[S.me,'Saya'],[other(S.me),pname(other(S.me))],['both','Berdua']].map(o=>h('option',{value:o[0],selected:o[0]===e.owner},o[1]))))),
    h('div',{class:'two'},field('Target (Rp, boleh kosong)','g-target',moneyIn('g-target',e.target)),
      field('Tenggat (boleh kosong)','g-due',h('input',{type:'date',id:'g-due',value:e.due})))],
    ()=>{const name=$('g-name').value.trim().slice(0,40);if(!name){toast('Isi nama tujuannya dulu.');return false}
      const d={name,kind:$('g-kind').value,owner:$('g-owner').value,target:digits($('g-target').value),due:DATE.test($('g-due').value)?$('g-due').value:''};
      if(g)goalRef(g.id).update(d).catch(writeFail);else goalRef().set(Object.assign({ts:Date.now(),moves:[]},d)).catch(writeFail);
      toast(g?'Perubahan disimpan.':'Tujuan dibuat.')},
    g&&armBtn('Hapus','Hapus tujuan dan riwayatnya?',()=>{goalRef(g.id).delete().catch(writeFail);$('dlg').close();toast('Tujuan dihapus.')}));
  if(!g)$('g-name').focus()}
function openMove(g,sign){const net=gStat(g).net;
  dlgForm((sign>0?'Setor ke ':'Tarik dari ')+g.name,[field('Jumlah (Rp)','f-amt',moneyIn('f-amt',0)),
    h('div',{class:'two'},dateIn(today()),field(sign>0?'Disetor oleh':'Ditarik oleh','f-by',whoSel('f-by',g.owner==='both'?S.me:g.owner))),noteIn('',sign>0?'mis. sisa uang saku':'mis. bayar tiket',60)],
    ()=>{const v=amtDate();if(!v)return false;
      if(sign<0&&v.amt>net){toast('Melebihi saldo setoran ('+rp(net)+').');return false}
      const m={id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),d:v.date,by:$('f-by').value,amt:sign*v.amt,note:$('f-note').value.trim().slice(0,60)};
      const p={moves:firebase.firestore.FieldValue.arrayUnion(m)};if(g.valAt)p.value=Math.max(0,g.value+m.amt);
      goalRef(g.id).update(p).catch(writeFail);toast(sign>0?'Setoran tercatat.':'Penarikan tercatat.')});
  $('f-amt').focus()}
function openValue(g,x){
  dlgForm('Nilai '+g.name+' sekarang',[h('p',{class:'muted',text:'Isi nilai total investasinya hari ini, seperti yang tertera di aplikasi sekuritas atau bank. Modal disetor: '+rp(x.net)+'.'}),
    field('Nilai sekarang (Rp)','f-amt',moneyIn('f-amt',x.val))],
    ()=>{if(!/[0-9]/.test($('f-amt').value)){toast('Isi nilainya dulu.');return false}
      goalRef(g.id).update({value:digits($('f-amt').value),valAt:today()}).catch(writeFail);toast('Nilai diperbarui.')});
  $('f-amt').focus()}

/* ---------- render ---------- */
let chT;function changed(){clearTimeout(chT);chT=setTimeout(render,40)}
function render(){const g=gate(),root=document.documentElement,perPerson=S.tab==='ringkas'||S.tab==='transaksi';
  root.dataset.ca=S.meta.colors.a||'nila';root.dataset.cb=S.meta.colors.b||'mawar';
  $('app').className=(perPerson?S.view:S.me)==='b'?'vb':'va';$('fab').className=S.me==='b'?'vb':'va';
  $('fab').hidden=!!g;$('nav').hidden=!!g;$('who').hidden=!!g||!perPerson;
  $('sub').textContent=g?'Catatan pengeluaran untuk berdua':perPerson?(S.view===S.me?'Keuanganmu':'Keuangan '+pname(S.view)):S.tab==='berdua'?'Kalian berdua':S.tab==='tabungan'?'Tabungan & investasi':'Pengaturan';
  $('duo').replaceChildren(...(g?[]:[avatar('a',34),avatar('b',34)]));
  if(g){$('view').replaceChildren(...g);return}
  $('who').replaceChildren(...[S.me,other(S.me)].map(sl=>h('button',{class:'who-b',type:'button','aria-pressed':String(S.view===sl),onclick:()=>{S.view=sl;S.fcat='';render()}},avatar(sl,22),sl===S.me?'Saya':pname(sl))));
  $('nav').replaceChildren(...TABS.map(([k,l,p])=>h('button',{type:'button','aria-current':S.tab===k?'page':null,onclick:()=>{S.tab=k;render();scrollTo(0,0)}},icon(p),l)));
  /* Jangan timpa formulir Atur saat pengguna sedang mengetik di dalamnya */
  const ae=document.activeElement;if(S.tab==='atur'&&ae&&ae.tagName==='INPUT'&&ae.type==='text'&&$('view').contains(ae)&&!ae.readOnly)return;
  if(!S.ready){$('view').replaceChildren(empty('Memuat catatan…','Sebentar, sedang mengambil data dari penyimpanan bersama.'));return}
  $('view').replaceChildren(...({ringkas:vRingkas,transaksi:vTransaksi,tabungan:vTabungan,berdua:vBerdua,atur:vAtur})[S.tab]())}

$('fab').addEventListener('click',()=>openTx(null));
if('serviceWorker' in navigator&&location.protocol==='https:')navigator.serviceWorker.register('sw.js').catch(()=>{});
boot();
})();
